# COCA-comparable duo, AugReg2 weights (what timm >= 0.9, including the pinned 1.0.24, gives for a bare vit_base_patch16_224).
# The ViT-B/16 here is timm's augreg2_in21k_ft_in1k (see src/utils/model.py), the ResNet-50 is torchvision's ORIGINAL (V1) weights: the
# pair COCA ("When Small Guides Large") evaluates. OPTIM values are the pre-tuning defaults, replaced by
# cfgs/tuned/tent__<model>.yaml where one exists (resnet50_v1 has one; run scripts/02_tune_tta.py --model vit_b_16_augreg2 for the ViT).
NAME: vitb16aug2_rn50v1

LARGE:
  NAME: vit_b_16_augreg2
  NORM: LN
  OPTIM: {METHOD: Adam, STEPS: 1, LR: 0.0001, BETA: 0.9, WD: 0.0}

SMALL:
  NAME: resnet50_v1
  NORM: BN
  OPTIM: {METHOD: SGD, STEPS: 1, LR: 0.00025, MOMENTUM: 0.9, DAMPENING: 0.0, WD: 0.0, NESTEROV: false}
