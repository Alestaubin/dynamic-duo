# Single-family duo: ViT-B/16 (large) + ViT-S/16 (small). Both members adapt LayerNorm, which is what
# makes this the test for synchronized collapse.
# TODO(phase 3): add the `vit_s_16` loader (timm vit_small_patch16_224; torchvision has no ViT-S).
# TODO(phase 5): the small member's default learning rate (cfgs/duo_lrs/vitb16_vits16__indep.yaml) is a placeholder until
# scripts/02_tune_tta.py --model vit_s_16 tunes it.
NAME: vitb16_vits16

LARGE:
  NAME: vit_b_16
  NORM: LN

SMALL:
  NAME: vit_s_16
  NORM: LN
