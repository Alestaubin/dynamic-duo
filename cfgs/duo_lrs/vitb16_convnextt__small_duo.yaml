# Learning rate of duo `vitb16_convnextt`, SMALL_DUO regime: the SMALL member alone adapts, on the entropy of the duo's combined prediction, while the
# large member is frozen (engine mode small_duo; script 03's Small adapt). Tuned for that member alone by scripts/02e_tune_small_adapt_lr.py
# (`--record`, or `python -m src.utils.duo_lrs --import_anchor <results.json>`); never the joint pair's rate. Only the small member has an
# entry. Until it is tuned, asking for it raises NotTuned.
duo: vitb16_convnextt
regime: small_duo
engine_mode: small_duo
methods:
  tent:
    small:
      model: convnext_tiny
      norm: LN
      batch_size: 64
      OPTIM:
        METHOD: SGD
        STEPS: 1
        LR: 7.0e-05
        MOMENTUM: 0.9
        DAMPENING: 0.0
        WD: 0.0
        NESTEROV: false
      source: /project/6104790/alxstaub/dynamic-duos/out/results/tune_small_adapt_lr/vitb16_convnextt__tent_bn/results.json
      tuned_on:
      - gaussian_blur/s5
      - saturate/s5
      - spatter/s5
      - speckle_noise/s5
      seeds:
      - 0
      - 1
      - 2
      temperatures: heldout_vitb16_convnextt_frozen_2cc8b343555e
      note: the small member adapts on the duo entropy, the other member is frozen
      duo_macro_accuracy: 0.55698
      worst_stream_accuracy: 0.32855
      grid:
        lrs:
        - 3.5e-05
        - 5.0e-05
        - 7.0e-05
        - 0.0001
        bn: true
      late_accuracy: 0.55792
      frozen_duo_macro_accuracy: 0.50917
