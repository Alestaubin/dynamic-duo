# Learning rates of duo `vitb16_rn50v1`, INDEP regime: each member adapts on its OWN entropy (engine mode both_indep; Vanilla DD).
# The one place these numbers live (cfgs/duos/ only names the models). `methods`: what was tuned, per TTA method and per member,
# recorded by scripts/02_tune_tta.py and 05_select_member_lr.py (src/utils/duo_lrs.py::record_tuned); `defaults`: what a member
# runs with when nothing is tuned for the method.
duo: vitb16_rn50v1
regime: indep
engine_mode: both_indep
defaults:
  large:
    model: vit_b_16
    norm: LN
    OPTIM:
      METHOD: Adam
      STEPS: 1
      LR: 0.0001
      BETA: 0.9
      WD: 0.0
    source: pre-tuning default (the former OPTIM block of cfgs/duos/vitb16_rn50v1.yaml)
  small:
    model: resnet50_v1
    norm: BN
    OPTIM:
      METHOD: SGD
      STEPS: 1
      LR: 0.00025
      MOMENTUM: 0.9
      DAMPENING: 0.0
      WD: 0.0
      NESTEROV: false
    source: pre-tuning default (the former OPTIM block of cfgs/duos/vitb16_rn50v1.yaml)
