        WD: 0.0
        NESTEROV: false
      source: scripts/05_select_member_lr.py
      tuned_on:
      - speckle_noise/s5
      - gaussian_blur/s5
      - spatter/s5
      - saturate/s5
      seed: 0
      macro_accuracy: 0.60275
      worst_stream_accuracy: 0.45922
      lrs_tried:
      - 0.0001
      - 0.00025
      - 0.0005
      - 0.001
      - 0.0025
  sar:
    large:
      model: vit_b_16
      norm: LN
      batch_size: 64
