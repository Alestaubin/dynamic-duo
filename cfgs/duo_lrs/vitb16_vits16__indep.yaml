# Learning rates of duo `vitb16_vits16`, INDEP regime: each member adapts on its OWN entropy (engine mode both_indep; Vanilla DD).
# The one place these numbers live (cfgs/duos/ only names the models). `methods`: what was tuned, per TTA method and per member,
# recorded by scripts/02_tune_tta.py and 05_select_member_lr.py (src/utils/duo_lrs.py::record_tuned); `defaults`: what a member
# runs with when nothing is tuned for the method.
duo: vitb16_vits16
regime: indep
engine_mode: both_indep
defaults:
  large:
    model: vit_b_16
    norm: LN
    OPTIM:
      METHOD: Adam
      STEPS: 1
      LR: 0.0001
      BETA: 0.9
      WD: 0.0
    source: pre-tuning default (the former OPTIM block of cfgs/duos/vitb16_vits16.yaml)
  small:
    model: vit_s_16
    norm: LN
    OPTIM:
      METHOD: Adam
      STEPS: 1
      LR: 0.0001
      BETA: 0.9
      WD: 0.0
    source: pre-tuning default (the former OPTIM block of cfgs/duos/vitb16_vits16.yaml)
methods:
  eata:
    large:
      model: vit_b_16
      norm: LN
      batch_size: 64
      OPTIM:
        METHOD: SGD
        STEPS: 1
        LR: 0.0005
        MOMENTUM: 0.9
        DAMPENING: 0.0
        WD: 0.0
        NESTEROV: false
      source: scripts/05_select_member_lr.py
      tuned_on:
      - speckle_noise/s5
      - gaussian_blur/s5
      - spatter/s5
      - saturate/s5
      seed: 0
      macro_accuracy: 0.60287
      worst_stream_accuracy: 0.4603
      lrs_tried:
      - 0.0001
      - 0.00025
      - 0.0005
      - 0.001
      - 0.0025
  eta:
