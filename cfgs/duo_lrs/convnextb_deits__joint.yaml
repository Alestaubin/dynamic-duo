# Learning rates of duo `convnextb_deits`, JOINT regime: both members adapt on the entropy of the duo's combined prediction (engine mode
# both_duo; the joint mode of scripts/03 and Joint DD). Tuned as PAIRS by scripts/02b_tune_joint_lr.py, which only reports:
# `python -m src.utils.duo_lrs --import_joint <results.json>` copies the best pair in. A method under `pending:` is being tuned:
# asking for it raises NotTuned (never the indep rates).
duo: convnextb_deits
regime: joint
engine_mode: both_duo
methods:
  tent:
    large:
      model: convnext_base
      norm: LN
      OPTIM:
        METHOD: SGD
        STEPS: 1
        LR: 0.00014
        MOMENTUM: 0.9
        DAMPENING: 0.0
        WD: 0.0
        NESTEROV: false
      source: /project/6104790/alxstaub/dynamic-duos/out/results/tune_joint_lr/convnextb_deits__tent_bn/results.json
      tuned_on:
      - gaussian_blur/s5
      - saturate/s5
      - spatter/s5
      - speckle_noise/s5
      duo_macro_accuracy: 0.62303
      worst_stream_accuracy: 0.38226
    small:
      model: deit_small
      norm: LN
      OPTIM:
        METHOD: SGD
        STEPS: 1
        LR: 0.0011
        MOMENTUM: 0.9
        DAMPENING: 0.0
        WD: 0.0
        NESTEROV: false
      source: /project/6104790/alxstaub/dynamic-duos/out/results/tune_joint_lr/convnextb_deits__tent_bn/results.json
      tuned_on:
      - gaussian_blur/s5
      - saturate/s5
      - spatter/s5
      - speckle_noise/s5
      duo_macro_accuracy: 0.62303
      worst_stream_accuracy: 0.38226
