# Learning rates of duo `vitb16_rn34`, SINGLE regime: each model tuned ALONE on its own entropy (the single-model Tent baseline), its optimum
# interior to the grid and kept for every test. Written by scripts/02c_tune_indep_pair.py (individual optima). The independent duo's PAIR
# lives in the indep file, the joint duo's in the joint file; tuning order: single, then indep and joint starting from these rates.
duo: vitb16_rn34
regime: single
engine_mode: both_indep
defaults:
  large:
    model: vit_b_16
    norm: LN
    OPTIM:
      METHOD: SGD
      STEPS: 1
      LR: 7.0e-05
      MOMENTUM: 0.9
      DAMPENING: 0.0
      WD: 0.0
      NESTEROV: false
    source: placeholder until scripts/02c_tune_indep_pair.py tunes this duo (2026-10-22); never used for results
  small:
    model: resnet34
    norm: BN
    OPTIM:
      METHOD: SGD
      STEPS: 1
      LR: 0.0005
      MOMENTUM: 0.9
      DAMPENING: 0.0
      WD: 0.0
      NESTEROV: false
    source: placeholder until scripts/02c_tune_indep_pair.py tunes this duo (2026-10-22); never used for results
methods:
  tent:
    large:
      model: vit_b_16
      norm: LN
      batch_size: 64
      OPTIM:
        METHOD: SGD
        STEPS: 1
        LR: 7.0e-05
        MOMENTUM: 0.9
        DAMPENING: 0.0
        WD: 0.0
        NESTEROV: false
      source: scripts/02c_tune_indep_pair.py
      tuned_on:
      - speckle_noise/s5
      - gaussian_blur/s5
      - spatter/s5
      - saturate/s5
      seeds: &id001
      - 0
      - 1
      - 2
      temperatures: heldout_vitb16_rn34_frozen_2e9fbea79473
      note: each model tuned ALONE
      macro_accuracy: 0.51766
      late_accuracy: 0.53102
      frozen_macro_accuracy: 0.48793
    small:
      model: resnet34
      norm: BN
      batch_size: 64
      OPTIM:
        METHOD: SGD
        STEPS: 1
        LR: 0.0007
        MOMENTUM: 0.9
        DAMPENING: 0.0
        WD: 0.0
        NESTEROV: false
      source: scripts/02c_tune_indep_pair.py
      tuned_on:
      - speckle_noise/s5
      - gaussian_blur/s5
      - spatter/s5
      - saturate/s5
      seeds: *id001
      temperatures: heldout_vitb16_rn34_frozen_2e9fbea79473
      note: each model tuned ALONE
      macro_accuracy: 0.43672
      late_accuracy: 0.44718
      frozen_macro_accuracy: 0.32735
