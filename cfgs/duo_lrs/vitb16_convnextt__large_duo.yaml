# Learning rate of duo `vitb16_convnextt`, LARGE_DUO regime: the LARGE member alone adapts, on the entropy of the duo's combined prediction, while the
# small member is frozen (engine mode large_duo; script 03's Large adapt). Tuned for that member alone by scripts/02d_tune_large_adapt_lr.py
# (`--record`, or `python -m src.utils.duo_lrs --import_anchor <results.json>`); never the joint pair's rate. Only the large member has an
# entry. Until it is tuned, asking for it raises NotTuned.
duo: vitb16_convnextt
regime: large_duo
engine_mode: large_duo
methods:
  tent:
    large:
      model: vit_b_16
      norm: LN
      batch_size: 64
      OPTIM:
        METHOD: SGD
        STEPS: 1
        LR: 0.0004
        MOMENTUM: 0.9
        DAMPENING: 0.0
        WD: 0.0
        NESTEROV: false
      source: /project/6104790/alxstaub/dynamic-duos/out/results/tune_large_adapt_lr/vitb16_convnextt__tent_bn/results.json
      tuned_on:
      - gaussian_blur/s5
      - saturate/s5
      - spatter/s5
      - speckle_noise/s5
      seeds:
      - 0
      - 1
      - 2
      temperatures: heldout_vitb16_convnextt_frozen_2cc8b343555e
      note: the large member adapts on the duo entropy, the other member is frozen
      duo_macro_accuracy: 0.55962
      worst_stream_accuracy: 0.35833
      grid:
        lrs:
        - 0.0002
        - 0.00028
        - 0.0004
        - 0.00056
        bn: true
      late_accuracy: 0.57754
      frozen_duo_macro_accuracy: 0.50917
