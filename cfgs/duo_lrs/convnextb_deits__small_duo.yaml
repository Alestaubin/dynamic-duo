# Learning rate of duo `convnextb_deits`, SMALL_DUO regime: the SMALL member alone adapts, on the entropy of the duo's combined prediction, while the
# large member is frozen (engine mode small_duo; script 03's Small adapt). Tuned for that member alone by scripts/02e_tune_small_adapt_lr.py
# (`--record`, or `python -m src.utils.duo_lrs --import_anchor <results.json>`); never the joint pair's rate. Only the small member has an
# entry. Until it is tuned, asking for it raises NotTuned.
duo: convnextb_deits
regime: small_duo
engine_mode: small_duo
methods:
  tent:
    small:
      model: deit_small
      norm: LN
      batch_size: 64
      OPTIM:
        METHOD: SGD
        STEPS: 1
        LR: 0.0016
        MOMENTUM: 0.9
        DAMPENING: 0.0
        WD: 0.0
        NESTEROV: false
      source: /project/6104790/alxstaub/dynamic-duos/out/results/tune_small_adapt_lr/convnextb_deits__tent_bn/results.json
      tuned_on:
      - gaussian_blur/s5
      - saturate/s5
      - spatter/s5
      - speckle_noise/s5
      seeds:
      - 0
      - 1
      - 2
      temperatures: heldout_convnextb_deits_frozen_3a9c254b15d4
      note: the small member adapts on the duo entropy, the other member is frozen
      duo_macro_accuracy: 0.57646
      worst_stream_accuracy: 0.33766
      grid:
        lrs:
        - 0.0011
        - 0.0016
        - 0.0023
        - 0.0032
        bn: true
      late_accuracy: 0.58687
      frozen_duo_macro_accuracy: 0.5268
