# Learning rate of duo `convnextb_deits`, LARGE_DUO regime: the LARGE member alone adapts, on the entropy of the duo's combined prediction, while the
# small member is frozen (engine mode large_duo; script 03's Large adapt). Tuned for that member alone by scripts/02d_tune_large_adapt_lr.py
# (`--record`, or `python -m src.utils.duo_lrs --import_anchor <results.json>`); never the joint pair's rate. Only the large member has an
# entry. Until it is tuned, asking for it raises NotTuned.
duo: convnextb_deits
regime: large_duo
engine_mode: large_duo
methods:
  tent:
    large:
      model: convnext_base
      norm: LN
      batch_size: 64
      OPTIM:
        METHOD: SGD
        STEPS: 1
        LR: 0.00028
        MOMENTUM: 0.9
        DAMPENING: 0.0
        WD: 0.0
        NESTEROV: false
      source: /project/6104790/alxstaub/dynamic-duos/out/results/tune_large_adapt_lr/convnextb_deits__tent_bn/results.json
      tuned_on:
      - gaussian_blur/s5
      - saturate/s5
      - spatter/s5
      - speckle_noise/s5
      seeds:
      - 0
      - 1
      - 2
      temperatures: heldout_convnextb_deits_frozen_3a9c254b15d4
      note: the large member adapts on the duo entropy, the other member is frozen
      duo_macro_accuracy: 0.59342
      worst_stream_accuracy: 0.32137
      grid:
        lrs:
        - 0.00014
        - 0.0002
        - 0.00028
        - 0.0004
        bn: true
      late_accuracy: 0.59688
      frozen_duo_macro_accuracy: 0.5268
